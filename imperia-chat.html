<!DOCTYPE html>

<style>

#cscale{position:relative;height:170px;max-width:340px;width:100%;margin:6px auto 0;flex:none}
.cstand{position:absolute;left:50%;top:34px;width:6px;height:128px;margin-left:-3px;background:var(--gold);border-radius:3px}
.cbase{position:absolute;bottom:0;left:50%;width:90px;height:8px;margin-left:-45px;background:var(--gold);border-radius:4px}
.cbeam{position:absolute;left:34px;right:34px;top:34px;height:6px;background:var(--gold);border-radius:3px;transition:transform 1.2s cubic-bezier(.3,1.5,.5,1)}
.cw{position:absolute;top:6px;width:58px;height:58px;margin-left:-29px;transition:transform 1.2s cubic-bezier(.3,1.5,.5,1)}
.cw.l{left:0}.cw.r{left:100%}
.cw::before{content:"";position:absolute;left:50%;top:-6px;width:2px;height:6px;background:var(--gold)}
.cw .ic{width:58px;height:58px;font-size:22px;border:3px solid var(--gold)}
.cl{position:absolute;left:50%;top:62px;transform:translateX(-50%);width:96px;text-align:center;font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl.g{color:#e53935}
.cs{position:absolute;left:50%;top:77px;transform:translateX(-50%);width:110px;text-align:center;font-size:11px;color:var(--sub);white-space:nowrap}
.cs.on{color:#2e9e5b}
#clog{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--chat)}
#cfoot{padding:8px 12px;background:var(--bar);border-top:1px solid var(--line);flex:none}
#cstat{text-align:center;font-size:14px;color:var(--sub);padding:2px 0}
#cin{resize:none}
#rec{color:#fff;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#rec video{width:240px;height:240px;border-radius:50%;object-fit:cover;border:3px solid var(--gold)}
</style></head><body>

<section id="join" class="hidden"><div class="box">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyA-VngdnbgfjUTnwMl0kr8IpvJZDiQ29Rg",authDomain:"imperia-laakar.firebaseapp.com",projectId:"imperia-laakar",storageBucket:"imperia-laakar.firebasestorage.app",messagingSenderId:"232422304071",appId:"1:232422304071:web:551d09d7ddc21164734462"});
var auth=firebase.auth(),db=firebase.firestore(),TS=firebase.firestore.FieldValue.serverTimestamp;
var $=function(i){return document.getElementById(i)};
document.documentElement.dataset.theme=localStorage.getItem("theme")||"light";
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
var EMP=10;
var star=function(n){return "★".repeat(n)};
var RN={10:"Император",9:"Королевская семья",8:"Помощник императора",7:"Воин",6:"Образцовый",5:"Работяга",4:"Достойный",3:"Обычный",2:"Плохой",1:"Совсем плохой"};
var PANEL={};PANEL[EMP]="all";PANEL[8]="mod";
function canPanel(){return !!PANEL[me.rank]}
function targets(){return others().filter(function(u){return me.rank===EMP||(u.rank||3)<me.rank})}
function canMod(u){return u.id!==canon[me.id]&&u.rank!==EMP&&(me.rank===EMP||(PANEL[me.rank]==="mod"&&(u.rank||3)<me.rank))}
function folded(){try{return JSON.parse(localStorage.getItem("folded")||"{}")}catch(e){return {}}}
function saveFolded(f){try{localStorage.setItem("folded",JSON.stringify(f))}catch(e){}}
function rname(r){return RN[r]||""}
function dots(n){n=Math.min(3,n||0);var w=el("span","vds"+(n>=3?" full":""));for(var i=0;i<3;i++)w.appendChild(el("i","vd"+(i<n?" on":"")));return w}
function dur(min){var d=Math.floor(min/1440),h=Math.floor(min%1440/60),m=min%60,o=[];if(d)o.push(d+" дн.");if(h)o.push(h+" ч.");if(m||!o.length)o.push(m+" мин.");return o.join(" ")}
var me={},users={},meta={},msgs=[],isAdmin=false,wantEmp=false,reply=null,unsubs=[],baseKick=null,adminBody=null,seenMe=false,canon={},groups={},editing=null,pinIdx=0,pinLen=0,msgsLoaded=false,metaLoaded=false,migrating=false;
function ms(t){return t&&t.toMillis?t.toMillis():0}
function err(t){$("joinErr").textContent=t||""}

/* ===== вход ===== */
$("name").value=localStorage.getItem("name")||"";
$("empBtn").onclick=function(){err();$("stepName").classList.add("hidden");$("stepPass").classList.remove("hidden");$("pass").focus()};
$("passBack").onclick=function(){err();$("stepPass").classList.add("hidden");$("stepName").classList.remove("hidden")};
$("passOk").onclick=async function(){
  try{
    await auth.signInAnonymously();
    await db.doc("admins/"+auth.currentUser.uid).set({key:$("pass").value.trim()});
    isAdmin=true;wantEmp=true;err();
    $("stepPass").classList.add("hidden");$("stepName").classList.remove("hidden");
    if($("name").value.trim())$("enter").click();else $("name").focus();
  }catch(e){err((e.code==="permission-denied"?"База отказала: пароль неверный или правила не опубликованы. ":"")+"Код: "+(e.code||e.message))}
};
function key(n){return (n||"").trim().toLowerCase()}
$("enter").onclick=async function(){
  var name=$("name").value.trim();if(!name)return err("Назови своё имя.");
  try{
    await auth.signInAnonymously();var uid=auth.currentUser.uid;
    var ref=db.doc("users/"+uid),s=await ref.get();
    if(s.exists){
      await ref.update({name:name});if(wantEmp&&s.data().rank!==EMP)await ref.update({rank:EMP});
      localStorage.setItem("name",name);err();return start(uid);
    }
    var all=await db.collection("users").get();
    var same=all.docs.filter(function(d){return key(d.data().name)===key(name)});
    if(!same.length)return await createProfile(uid,name,null,[]);
    same.sort(function(a,b){return (b.data().rank||0)-(a.data().rank||0)});
    var b=sheet("В чертогах уже есть «"+same[0].data().name+"»");
    b.appendChild(el("p",null,"Это твой профиль?"));
    btn(b,"Да, это я",function(){b.parentNode.remove();guard(createProfile(uid,same[0].data().name,same[0].data(),same))});
    btn(b,"Нет, другое имя",function(){b.parentNode.remove();err("Выбери другое имя.");$("name").focus()},true);
  }catch(e){err("Не удалось войти: "+(e.code||e.message))}
};
async function createProfile(uid,name,old,olds){
  var base={name:name,avatar:"",mutedUntil:new Date(0),joinedAt:TS()},ref=db.doc("users/"+uid),ranks=[];
  if(old&&!wantEmp&&old.rank>3&&old.rank<EMP)ranks.push(old.rank);
  ranks.push(wantEmp?EMP:3);
  for(var i=0;i<ranks.length;i++){
    try{await ref.set(Object.assign({rank:ranks[i]},base));break}catch(e){if(i===ranks.length-1)throw e}
  }
  if(old){
    var u={};if(old.avatar)u.avatar=old.avatar;if(old.title)u.title=old.title;
    if(Object.keys(u).length){try{await ref.update(u)}catch(e){}}
    /* старые дубли с этим именем убираем, если база разрешит */
    olds.forEach(function(d){if(d.id!==uid)d.ref.delete().catch(function(){})});
  }
  localStorage.setItem("name",name);err();start(uid);
}
/* автовход: если устройство уже входило, лобби пропускаем */
var booted=false;
function showJoin(){if(booted)return;booted=true;$("join").classList.remove("hidden")}
auth.onAuthStateChanged(async function(u){
  if(booted)return;
  try{if(u){var s=await db.doc("users/"+u.uid).get();if(s.exists){booted=true;return start(u.uid)}}}catch(e){}
  showJoin();
});
setTimeout(showJoin,5000);
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();

function leave(text){
  unsubs.forEach(function(u){u()});unsubs=[];baseKick=null;seenMe=false;cmsgs=[];closeCourt();$("courtbar").classList.add("hidden");
  $("chat").classList.add("hidden");$("join").classList.remove("hidden");
  $("stepPass").classList.add("hidden");$("stepName").classList.remove("hidden");
  $("enter").textContent="Войти в чертоги";wantEmp=false;err(text);
}

/* ===== чат ===== */
function av(url,name,cls){var d=el("span","ic "+(cls||""));if(url){var i=new Image();i.src=url;d.appendChild(i)}else d.textContent=(name||"?").charAt(0).toUpperCase();return d}
function start(uid){
  me={id:uid};seenMe=false;$("join").classList.add("hidden");$("chat").classList.remove("hidden");
  els={};msgsLoaded=false;$("list").innerHTML="";delete $("list").dataset.done;
  unsubs.push(db.collection("users").onSnapshot(function(s){
    users={};s.forEach(function(d){users[d.id]=Object.assign({id:d.id},d.data())});buildGroups();
    if(!users[uid]){if(seenMe)return leave("Тебя изгнали из королевства. Можно вернуться.");return}seenMe=true;me=users[uid];
    var k=ms(me.kickedAt);if(baseKick===null)baseKick=k;else if(k>baseKick)return leave("Тебя изгнали из королевства. Можно вернуться.");
    var mm=$("me");mm.textContent=star(me.rank)+" "+me.name+(me.title?" · "+me.title:"");
    if(me.rank!==EMP)mm.appendChild(dots(me.violations));
    mm.appendChild(document.createTextNode(" · v14"));
    $("adm").classList.toggle("hidden",!canPanel());
    checkMute();refreshWho();migrate();renderCourt();
  },function(e){leave("Нет доступа: "+e.code)}));
  unsubs.push(db.doc("meta/chat").onSnapshot(function(s){
    meta=s.data()||{};$("title").textContent=meta.title||"Imperia";
    var t=$("top");t.innerHTML="";t.appendChild(meta.avatar?av(meta.avatar,"",""):document.createTextNode("♛")).className;
    if(meta.avatar){t.firstChild.style.cssText="width:100%;height:100%;border:0"}
    metaLoaded=true;migrate();renderPin();
  }));
  unsubs.push(db.collection("messages").orderBy("createdAt").limitToLast(100).onSnapshot(function(s){
    msgs=s.docs.map(function(d){return Object.assign({id:d.id},d.data({serverTimestamps:"estimate"}))}).filter(function(m){return m.type!=="court"});msgsLoaded=true;render();renderPin();
  }));
  unsubs.push(db.collection("messages").where("type","==","court").onSnapshot(function(s){
    cmsgs=s.docs.map(function(d){return Object.assign({id:d.id},d.data({serverTimestamps:"estimate"}))});renderCourt();
  },function(){}));
}
function migrate(){
  if(migrating||!metaLoaded||!me.name||meta.scale===10||me.rank!==6)return;
  migrating=true;
  db.doc("users/"+me.id).update({rank:EMP}).then(function(){return db.doc("meta/chat").set({scale:10},{merge:true})}).catch(function(){}).then(function(){migrating=false});
}
setInterval(function(){if(me.id)checkMute()},15000);
function checkMute(){
  var left=ms(me.mutedUntil)-Date.now(),n=$("note"),lock=(me.violations||0)>=3&&me.rank!==EMP;
  n.classList.toggle("hidden",left<=0&&!lock);
  if(lock)n.textContent="Три нарушения. Слово отнято, пока император не понизит тебя.";
  else if(left>0)n.textContent="Ты в темнице ещё "+dur(Math.ceil(left/60000))+".";
  $("form").style.display=(left>0||lock)?"none":"flex";
}
function pad(n){return n<10?"0"+n:n}
function mediaSrc(m,node,frag){
  fetch(m.data).then(function(r){return r.blob()}).then(function(b){node.src=URL.createObjectURL(b)+frag}).catch(function(){node.src=m.data});
}
function buildGroups(){

async function record(kind){
  var vid=kind==="video",stream;
  try{stream=await navigator.mediaDevices.getUserMedia(vid?{audio:true,video:{facingMode:"user",width:240,height:240,aspectRatio:1}}:{audio:true})}
  catch(e){return say("Нет доступа к микрофону/камере.")}
  var types=vid?["video/mp4","video/webm;codecs=vp8,opus","video/webm"]:["audio/mp4","audio/webm;codecs=opus","audio/webm"];
  var mime=types.find(function(t){return window.MediaRecorder&&MediaRecorder.isTypeSupported(t)})||"";
  var rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:200000,audioBitsPerSecond:32000}:{}),chunks=[],cancel=false;
  var o=el("div");o.id="rec";var tm=el("div",null,"0 c");
  if(vid){var pv=el("video");pv.muted=true;pv.playsInline=true;pv.srcObject=stream;pv.play();o.appendChild(pv)}else o.appendChild(el("div",null,"🎤 Запись…"));
  var ok=el("button","btn","Отправить"),no=el("button","btn alt","Отмена");ok.style.width=no.style.width="200px";
  o.append(tm,ok,no);document.body.appendChild(o);
  var t0=Date.now(),max=vid?10:60,iv=setInterval(function(){var s=Math.floor((Date.now()-t0)/1000);tm.textContent=s+" / "+max+" c";if(s>=max)rec.stop()},500);
  rec.ondataavailable=function(e){chunks.push(e.data)};
  rec.onstop=function(){
    clearInterval(iv);stream.getTracks().forEach(function(t){t.stop()});o.remove();if(cancel)return;
    var b=new Blob(chunks,{type:(rec.mimeType||mime||(vid?"video/mp4":"audio/mp4")).split(";")[0]}),r=new FileReader();
    r.onload=function(){if(r.result.length>900000)return say("Слишком большое, запиши короче.");send({type:kind,text:vid?"⭕ Кружок":"🎤 Голосовое",data:r.result})};r.readAsDataURL(b);
  };
  ok.onclick=function(){rec.stop()};no.onclick=function(){cancel=true;rec.stop()};rec.start();
}

var cmsgs=[],courtOv=null,courtAuto={},cin=null;
function cu(id,name){return users[id]||{id:id,name:name||"?",avatar:"",rank:3}}
function courtState(){
  var a=cmsgs.slice().sort(function(x,y){return ms(x.createdAt)-ms(y.createdAt)}),open=null;
  a.forEach(function(m){if(m.kind==="open")open=m});
  if(!open)return null;
  var joined={};a.forEach(function(x){if(x.kind==="join"&&x.court===open.id)joined[canon[x.uid]||x.uid]=1});
  return {id:open.id,joined:joined,a:open.a,b:open.b,an:open.an,bn:open.bn,judge:open.judge,
    says:a.filter(function(x){return x.kind==="say"&&x.court===open.id}),
    verdict:a.find(function(x){return x.kind==="verdict"&&x.court===open.id})||null};
}
function courtSend(o){return db.collection("messages").add(Object.assign({uid:me.id,name:me.name,type:"court",createdAt:TS()},o)).catch(function(e){say("Не вышло: "+(e.code||e.message))})}
function inCourt(st){var c=canon[me.id];return !!st&&!!c&&(c===st.a||c===st.b||c===st.judge)}
function closeCourt(){if(courtOv){courtOv.remove();courtOv=null;cin=null}}
function renderCourt(){
  var st=courtState(),bar=$("courtbar"),active=!!st&&!st.verdict&&inCourt(st);
  bar.classList.toggle("hidden",!active);
  if(active)bar.textContent="⚖ Суд идёт: "+st.an+" и "+st.bn+" — открыть";
  if(st&&inCourt(st)){
    if(!st.verdict&&!courtAuto[st.id]){courtAuto[st.id]=1;if(!courtOv)openCourt()}
    if(st.verdict&&!courtAuto[st.id+"v"]){courtAuto[st.id+"v"]=1;if(!courtOv&&Date.now()-ms(st.verdict.createdAt)<120000)openCourt()}
  }
  if(courtOv){drawCourt();courtJoin()}
}
$("courtbar").onclick=function(){openCourt()};
function openCourt(){
  if(courtOv)return;
  var o=el("div");o.id="court";
  o.innerHTML='<div class="chead"><span>⚖ Суд</span><button class="ib" id="cx" type="button" style="font-size:20px;padding:0 4px">✕</button></div>'
   +'<div id="cscale"><div class="cstand"></div><div class="cbase"></div><div class="cbeam" id="cbeam"><div class="cw l" id="cwa"></div><div class="cw r" id="cwb"></div></div></div>'
   +'<div id="clog"></div>'
   +'<div id="cfoot"><div id="cstat"></div><div id="cwrite"><textarea id="cin" rows="2" maxlength="600" placeholder="Изложи, что случилось…"></textarea><button class="btn" id="csend" type="button">Изложить</button></div><div id="cjudge"></div></div>';
  document.body.appendChild(o);courtOv=o;cin=$("cin");
  $("cx").onclick=closeCourt;
  $("csend").onclick=function(){
    var st=courtState();if(!st||st.verdict)return;
    var next=st.says.length%2===0?st.a:st.b,t=cin.value.trim();
    if(!t||canon[me.id]!==next)return;
    cin.value="";courtSend({kind:"say",court:st.id,text:t});
  };
  drawCourt();
}
function drawCourt(){
  var st=courtState();if(!st){closeCourt();return}
  var c=canon[me.id],A=cu(st.a,st.an),B=cu(st.b,st.bn),v=st.verdict;
  var tilt=v&&v.guilty?(v.guilty===st.a?-14:14):0;
  $("cbeam").style.transform="rotate("+tilt+"deg)";
  [["cwa",A,st.a],["cwb",B,st.b]].forEach(function(p){
    var w=$(p[0]);w.style.transform="rotate("+(-tilt)+"deg)";w.innerHTML="";
    w.appendChild(av(p[1].avatar,p[1].name,""));
    w.appendChild(el("span","cl"+(v&&v.guilty===p[2]?" g":""),p[1].name));
    var jn=!!st.joined[p[2]];w.appendChild(el("span","cs"+(jn?" on":""),jn?"в зале суда":"ещё не в сети"));
  });
  var lg=$("clog");lg.innerHTML="";
  if(!st.says.length)lg.appendChild(el("div","sys","Стороны ещё не изложили суть дела."));
  st.says.forEach(function(m){
    var isA=(canon[m.uid]||"")===st.a||key(m.name)===key(st.an),u=isA?A:B;
    var r=el("div","r"+(isA?"":" mine")),d=el("div","msg");
    r.appendChild(av(u.avatar,u.name,"av"));r.appendChild(d);
    d.appendChild(el("div","who",u.name));d.appendChild(el("div","text",m.text));lg.appendChild(r);
  });
  if(v)lg.appendChild(el("div","sys",v.guilty?"⚖ Приговор: виновен — "+(v.gn||"?")+"\n"+star(v.rank||1)+" "+rname(v.rank||1):"⚖ Суд отменён, приговора нет."));
  lg.scrollTop=lg.scrollHeight;
  var nextA=st.says.length%2===0,myTurn=!v&&c===(nextA?st.a:st.b);
  $("cwrite").classList.toggle("hidden",!myTurn);
  $("cstat").textContent=v?"Суд окончен.":(myTurn?"Твоё слово.":"Слово берёт "+(nextA?A.name:B.name)+(st.joined[nextA?st.a:st.b]?".":" — ещё не в сети."));
  var j=$("cjudge");j.innerHTML="";
  if(!v&&c===st.judge){
    btn(j,"⚖ Вынести приговор",function(){courtGuilty(st)});
    btn(j,"✖ Отменить суд",function(){confirmBox("Отменить суд? Приговора не будет.",function(){courtSend({kind:"verdict",court:st.id,guilty:null})})},true);
  }else if(v)btn(j,"Закрыть",closeCourt,true);
}
function courtGuilty(st){
  var b=sheet("Кто виновен?");
  [[st.a,st.an],[st.b,st.bn]].forEach(function(p){
    var u=cu(p[0],p[1]);
    btn(b,u.name+" · "+star(u.rank||3),function(){b.parentNode.remove();courtSentence(st,u)});
  });
  btn(b,"Отмена",function(){b.parentNode.remove()},true);
}
function courtSentence(st,u){
  var cur=u.rank||3;
  if(cur<=1)return finishCourt(st,u,1);
  var b=sheet("Виновен: "+u.name+". Сколько звёзд оставить?");
  for(var r=cur-1;r>=1;r--)(function(r){btn(b,r+" · "+rname(r)+"\n"+star(r),function(){b.parentNode.remove();finishCourt(st,u,r)},true).style.whiteSpace="pre-line"})(r);
  btn(b,"Назад",function(){b.parentNode.remove();courtGuilty(st)},true);
}
async function finishCourt(st,u,r){
  if(r<(u.rank||3)){var ok=await setRank(u,r,"⚖ Суд ("+st.an+" и "+st.bn+"): виновен — ");if(!ok)return}
  else send({type:"system",text:"⚖ Суд ("+st.an+" и "+st.bn+"): виновен — "+u.name+". Звёзд и так минимум."});
  courtSend({kind:"verdict",court:st.id,guilty:u.id,gn:u.name,rank:r});
}
function courtJoin(){
  var st=courtState(),c=canon[me.id];
  if(!st||st.verdict||(c!==st.a&&c!==st.b)||st.joined[c]||courtAuto[st.id+"j"])return;
  courtAuto[st.id+"j"]=1;courtSend({kind:"join",court:st.id});
}
function startCourt(){
  var st=courtState();
  if(st&&!st.verdict){if(inCourt(st))openCourt();else say("Суд уже идёт: "+st.an+" и "+st.bn+".");return}
  pick("Суд: первый спорщик",others(),function(a){
    pick("Суд: второй спорщик",others().filter(function(u){return u.id!==a.id}),function(b){
      courtSend({kind:"open",a:a.id,b:b.id,an:a.name,bn:b.name,judge:canon[me.id]});
    },"Больше никого нет.");
  });
}

/* ===== админ-панель ===== */
function rankTable(ov){
  var out=[];
  for(var r=EMP;r>=1;r--){
    var n=everyone().filter(function(u){return(ov&&ov.id===u.id?ov.rank:u.rank)===r}).map(function(u){return u.name+(u.title?" ("+u.title+")":"")});
    out.push(star(r)+" "+rname(r)+" — "+(n.join(", ")||"—"));
  }
  return out.join("\n");
}
async function setRank(u,r,head){
  if(r<1||r>EMP||me.rank!==EMP||u.id===canon[me.id])return false;
  var d={rank:r},freed=(u.violations||0)>=3&&(r<u.rank||(r===1&&u.rank===1));
  if(freed)d.violations=0;
  try{await upd(u,d)}catch(e){say("Не вышло: "+(e.code||e.message));return false}
  send({type:"system",text:(head||"Милость императора: ")+u.name+" → "+star(r)+" "+rname(r)+(freed?"\nНарушения сняты, слово возвращено.":"")+"\n\n"+rankTable({id:u.id,rank:r})});
  return true;
}
async function addViolation(u,delta){
  if(!canMod(u)||(delta<0&&me.rank!==EMP))return;
  var was=u.violations||0,n=Math.max(0,Math.min(3,was+delta));
  if(n===was)return say(delta>0?"У «"+u.name+"» уже три нарушения.":"У «"+u.name+"» нет нарушений.");
  try{await upd(u,{violations:n})}catch(e){return say("Не вышло: "+(e.code||e.message))}
  send({type:"system",text:delta>0?"⚠ Нарушение: "+u.name+" — "+n+" из 3"+(n>=3?"\nСлово отнято, пока император не понизит звёзды.":""):"🕊 Император простил нарушение: "+u.name+" — "+n+" из 3"});
}
async function clearChat(){
  if(me.rank!==EMP)return;
  try{
    var docs=(await db.collection("messages").get()).docs;
    for(var i=0;i<docs.length;i+=20){await Promise.all(docs.slice(i,i+20).map(function(d){return d.ref.delete()}))}
    await db.doc("meta/chat").set({pins:[],pinned:null},{merge:true});
    document.querySelectorAll(".ov").forEach(function(x){x.remove()});
  }catch(e){say("Геноцид не удался: "+(e.code||e.message))}
}
function everyone(){return Object.keys(groups).map(function(n){return groups[n][0]}).sort(function(a,b){return b.rank-a.rank})}
function others(){return everyone().filter(function(u){return u.id!==canon[me.id]})}
function grp(u){return groups[key(u.name)]||[u]}
function upd(u,d){return Promise.all(grp(u).map(function(x){return db.doc("users/"+x.id).update(d)}))}
function pick(title,list,act,empty){
  var b=sheet(title);
  if(!list.length)b.appendChild(el("p",null,empty||"Подданных ещё нет."));
  list.forEach(function(u){
    var r=el("div","row");r.appendChild(av(u.avatar,u.name,"sm"));
    r.appendChild(el("div","n",star(u.rank)+" "+u.name+(u.title?" — "+u.title:"")+(ms(u.mutedUntil)>Date.now()?" 🔇":"")+((u.violations||0)?" ⚠"+u.violations+"/3":"")));
    var go=el("button",null,"Выбрать");go.onclick=function(){b.parentNode.remove();act(u)};r.appendChild(go);b.appendChild(r);
  });
  btn(b,"Отмена",function(){b.parentNode.remove()},true);
}
function muteSheet(u){
  var b=sheet("Темница: "+u.name),left=ms(u.mutedUntil)-Date.now();
  if(left>0)b.appendChild(el("p",null,"Уже сидит ещё "+dur(Math.ceil(left/60000))+". Новый срок прибавится к нему."));
  var g=el("div","bgs");b.appendChild(g);
  [[5,"На 5 минут"],[30,"На полчаса"],[60,"На час"],[1440,"На сутки"]].forEach(function(o){
    btn(g,o[1],function(){
      b.parentNode.remove();
      var base=Math.max.apply(null,[Date.now()].concat(grp(u).map(function(x){return ms(x.mutedUntil)})));
      guard(upd(u,{mutedUntil:new Date(base+o[0]*60000)}));
    },true)});
}
function rankSheet(u){
  var b=sheet("Звёзды: "+u.name);
  for(var r=EMP;r>=1;r--)(function(r){btn(b,r+" · "+rname(r)+"\n"+star(r),function(){b.parentNode.remove();setRank(u,r)},u.rank!==r).style.whiteSpace="pre-line"})(r);
}
$("adm").onclick=function(){
  if(!canPanel())return;
  var full=me.rank===EMP,b=sheet("Совет императора"),g=el("div","bgs");b.appendChild(g);
  btn(g,"⛓ Бросить в темницу",function(){pick("Кого бросить в темницу",targets(),muteSheet)},true);
  btn(g,"⚠ Дать нарушение",function(){pick("Кому дать нарушение",targets().filter(function(u){return u.rank!==EMP}),function(u){addViolation(u,1)})},true);
  if(!full)return;
  btn(g,"🗝 Выпустить из темницы",function(){pick("Кого выпустить из темницы",everyone().filter(function(u){return ms(u.mutedUntil)>Date.now()}),function(u){guard(upd(u,{mutedUntil:new Date(0)}))},"Темница пуста.")},true);
  btn(g,"⚔ Изгнать из королевства",function(){pick("Кого изгнать",others(),function(u){confirmBox("Изгнать "+u.name+" из королевства?",function(){
    var ds=grp(u);guard(upd(u,{kickedAt:TS()}).then(function(){return new Promise(function(r){setTimeout(r,1200)})}).then(function(){return Promise.all(ds.map(function(x){return db.doc("users/"+x.id).delete()}))}))})})},true);
  btn(g,"🕊 Простить нарушение",function(){pick("Кого простить",others().filter(function(u){return(u.violations||0)>0}),function(u){addViolation(u,-1)},"Нарушителей нет.")},true);
  btn(g,"★ Пожаловать звёзды",function(){pick("Кому пожаловать звёзды",others(),rankSheet)},true);
  btn(g,"📜 Пожаловать титул",function(){pick("Кому пожаловать титул",everyone(),function(u){askBox("Титул для "+u.name+" (пусто — лишить)",u.title||"",function(v){guard(upd(u,{title:v.slice(0,30)}))})})},true);
  btn(g,"⚖ Суд",startCourt,true);
  btn(g,"🔥 Устроить геноцид сообщений",function(){confirmBox("Устроить геноцид сообщений? Все они будут уничтожены навсегда.",clearChat)},true);
};
</script>
</body></html>
